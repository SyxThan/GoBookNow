services:
  postgres-integration:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: gobook_test
    ports:
      - "127.0.0.1:5433:5432"
    # No persistent volume: this service belongs only to integration tests.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d gobook_test"]
      interval: 2s
      timeout: 5s
      retries: 20
