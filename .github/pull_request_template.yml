## Checklist

### Code

- [ ] Scope chỉ giải quyết issue hiện tại
- [ ] Không có code/debug thừa
- [ ] Không commit secret
- [ ] Naming rõ ràng
- [ ] Error handling đã xử lý

### Backend

- [ ] Validation đã thêm
- [ ] Authorization đã kiểm tra
- [ ] Migration đã review
- [ ] Prisma generate thành công
- [ ] API documentation đã cập nhật nếu cần

### Testing

- [ ] Unit tests pass
- [ ] Integration tests pass nếu cần
- [ ] Đã test error cases
- [ ] Đã test thủ công

### CI

- [ ] Lint pass
- [ ] Test pass
- [ ] Build pass

