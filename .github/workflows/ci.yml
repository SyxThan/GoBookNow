name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main
      - test/integration
      - test/payment-edge-cases
      - test/e2e
      - chore/security-observability
      - feat/frontend-neo-brutalism

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: gobook
          POSTGRES_PASSWORD: gobook_test
          POSTGRES_DB: gobook_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U gobook -d gobook_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://gobook:gobook_test@localhost:5432/gobook_test?schema=public

      REDIS_URL: redis://localhost:6379

      NODE_ENV: test

      JWT_ACCESS_SECRET: ci-only-access-secret-change-outside-tests
      JWT_ACCESS_EXPIRES_IN: 15m

      REFRESH_TOKEN_TTL_DAYS: "7"
      AUTH_REFRESH_COOKIE_NAME: gobook_refresh_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      FRONTEND_ORIGIN: http://localhost:3000
      SWAGGER_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Scan tracked source for accidental secrets
        run: node scripts/check-secrets.mjs

      - name: Apply database migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck applications and security/observability tests
        run: |
          pnpm --filter backend typecheck
          # This script generates Next route helpers before running tsc.
          pnpm --filter frontend typecheck

      - name: Test
        run: pnpm test

      - name: End-to-end test
        run: pnpm --filter backend test:e2e

      - name: Build
        run: pnpm build

  integration:
    name: PostgreSQL lifecycle integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis-security:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gobook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d gobook_test"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/gobook_test?schema=public
      INTEGRATION_TEST_ALLOW_CLEANUP: "1"
      SECURITY_TEST_REDIS_URL: redis://127.0.0.1:6380
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify dedicated security Redis is reachable from the runner
        working-directory: apps/backend
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from 'redis';
          const client = createClient({
            url: process.env.SECURITY_TEST_REDIS_URL,
            socket: { connectTimeout: 5000, reconnectStrategy: false },
          });
          client.on('error', () => {});
          try {
            await client.connect();
            if (await client.ping() !== 'PONG') throw new Error();
            console.log('Dedicated security Redis is ready on runner port 6380.');
          } catch {
            throw new Error('Integration Redis unavailable: check redis-security service and 6380:6379 port mapping.');
          } finally {
            if (client.isOpen) client.destroy();
          }
          NODE
      - name: Guard database, validate, generate and deploy clean migrations
        run: pnpm --filter backend test:integration:prepare
      - name: Run PostgreSQL integration suite
        # Includes security + Redis + observability; no duplicate focused jobs.
        run: pnpm --filter backend test:integration
      - name: Repeat with shuffled test order
        run: pnpm --filter backend test:integration --sequence.shuffle --sequence.seed=20261022
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: apps/backend/test-results/integration.xml
          if-no-files-found: ignore
